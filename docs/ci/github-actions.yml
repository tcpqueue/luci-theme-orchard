name: Check theme

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check status data and JavaScript
        run: node tests/status.test.mjs
      - name: Check plugin menus
        run: node tests/menu.test.mjs
      - name: Check installation scripts
        run: sh tests/staging.sh
