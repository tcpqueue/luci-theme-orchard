name: Check theme

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Check status data and JavaScript
        run: node tests/status.test.mjs
      - name: Check plugin menus
        run: node tests/menu.test.mjs
      - name: Check installation scripts
        run: sh tests/staging.sh
